name: Add favicon
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add favicon link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          link = '<link rel="icon" type="image/png" href="favicon.png">'
          if link not in s:
              s = s.replace('</head>', link + '</head>', 1)
              p.write_text(s)
          PY
      - name: Commit favicon change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add favicon to site'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/add-favicon.yml
          git add .github/workflows/add-favicon.yml
          git diff --cached --quiet || git commit -m 'Remove temporary favicon workflow'
          git push
