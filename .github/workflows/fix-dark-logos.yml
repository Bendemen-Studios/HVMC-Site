name: Fix partner logo backgrounds
on:
  push:
    branches: [main]
    paths:
      - "Partners/bendemen.png"
      - "Partners/bendemenstudios.png"
      - ".github/workflows/fix-dark-logos.yml"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg
      - name: Remove black backgrounds
        shell: bash
        run: |
          set -e
          for f in Partners/bendemen.png Partners/bendemenstudios.png; do
            [ -f "$f" ] || continue
            alpha="alpha.png"
            tmp="${f%.png}-transparent.png"
            convert "$f" -colorspace Gray -evaluate multiply 8 -clamp "$alpha"
            convert "$f" -alpha off -fill black -colorize 100 "$alpha" -compose CopyOpacity -composite "$tmp"
            mv "$tmp" "$f"
            rm -f "$alpha"
          done
      - name: Rebuild AVIF files
        shell: bash
        run: |
          set -e
          for f in Partners/bendemen.png Partners/bendemenstudios.png; do
            [ -f "$f" ] || continue
            out="${f%.png}.avif"
            ffmpeg -y -i "$f" -c:v libaom-av1 -crf 30 -b:v 0 -still-picture 1 "$out"
          done
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Partners/bendemen.png Partners/bendemen.avif Partners/bendemenstudios.png Partners/bendemenstudios.avif
          git diff --cached --quiet || git commit -m "Fix partner logo backgrounds"
          git push
