name: Fix partner logo backgrounds
on:
  push:
    branches: [main]
    paths:
      - "Partners/bendemen.png"
      - "Partners/bendemenstudios.png"
      - ".github/workflows/fix-dark-logos.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original dark logos
        shell: bash
        run: |
          set -e
          git fetch --no-tags origin e1654541c0bba2ce9f9ea3bda54564a1f8d8a0c5
          git show e1654541c0bba2ce9f9ea3bda54564a1f8d8a0c5:Partners/bendemen.png > /tmp/bendemen-source.png
          git show e1654541c0bba2ce9f9ea3bda54564a1f8d8a0c5:Partners/bendemenstudios.png > /tmp/bendemenstudios-source.png
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg
      - name: Make black logos transparent
        shell: bash
        run: |
          set -e
          for name in bendemen bendemenstudios; do
            src="/tmp/$name-source.png"
            out="Partners/$name.png"
            mask="/tmp/$name-mask.png"
            convert "$src" -colorspace Gray -evaluate multiply 10 -clamp "$mask"
            convert "$src" -alpha off -fill black -colorize 100 "$mask" -alpha off -compose CopyOpacity -composite "$out"
          done
      - name: Rebuild AVIF files
        shell: bash
        run: |
          set -e
          for name in bendemen bendemenstudios; do
            ffmpeg -y -i "Partners/$name.png" -c:v libaom-av1 -crf 30 -b:v 0 -still-picture 1 "Partners/$name.avif"
          done
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Partners/bendemen.png Partners/bendemen.avif Partners/bendemenstudios.png Partners/bendemenstudios.avif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore black transparent partner logos"
          git pull --rebase origin main
          git push
