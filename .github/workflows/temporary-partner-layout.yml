name: Temporary partner layout fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'partner-layout-fix')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve partner slider layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.cards,.partners,.contact-grid,.form-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px}', '.cards,.partners,.contact-grid,.form-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px}.partners>*{min-width:0}')
          s=s.replace('.recognitions,.other-partners{overflow:hidden;position:relative;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:22px}', '.recognitions,.other-partners{overflow:hidden;position:relative;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;min-width:0}')
          s=s.replace('.recognition-track,.other-partner-track{display:flex;width:max-content;animation:partner-scroll 18s linear infinite}', '.recognition-track,.other-partner-track{display:flex;width:max-content;animation:partner-scroll 18s linear infinite;will-change:transform}')
          s=s.replace('.other-partner-slide{height:95px;color:var(--muted);font-weight:700;font-size:17px}', '.other-partner-slide{height:95px;color:var(--muted);font-weight:700;font-size:16px;flex:0 0 25%;width:25%;min-width:25%;padding:10px 18px}')
          old='<div class="other-partner-track"><div class="other-partner-slide">Nog geen overige partners.</div><div class="other-partner-slide">Nog geen overige partners.</div><div class="other-partner-slide">Nog geen overige partners.</div><div class="other-partner-slide">Nog geen overige partners.</div></div>'
          new='<div class="other-partner-track"><div class="other-partner-slide">Nog geen overige partners.</div><div class="other-partner-slide">Nog geen overige partners.</div><div class="other-partner-slide">Nog geen overige partners.</div><div class="other-partner-slide">Nog geen overige partners.</div><div class="other-partner-slide">Nog geen overige partners.</div><div class="other-partner-slide">Nog geen overige partners.</div><div class="other-partner-slide">Nog geen overige partners.</div><div class="other-partner-slide">Nog geen overige partners.</div></div>'
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: improve other partners layout [partner-layout-fix]'
          git push