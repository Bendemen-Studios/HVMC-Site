name: Temporary partner layout fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'partner-layout-fix')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make partner sliders seamless
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* seamless-partner-slider-fix */'
          css='''\n          /* seamless-partner-slider-fix */\n          .recognitions,.other-partners{overflow:hidden!important;position:relative;width:100%;min-width:0}\n          .recognition-track,.other-partner-track{display:flex!important;width:max-content!important;animation:partner-scroll-seamless 22s linear infinite!important;will-change:transform}\n          .partner-slider-set{display:flex;flex:0 0 auto}\n          .recognition-slide,.other-partner-slide{flex:0 0 220px;width:220px}\n          @keyframes partner-scroll-seamless{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n          @media(max-width:700px){.recognition-slide,.other-partner-slide{flex-basis:200px;width:200px}}\n          '''
          if marker not in s:
              s=s.replace('</style>', css+'</style>')
          js='''\n          <script>\n          document.addEventListener('DOMContentLoaded',()=>{\n            document.querySelectorAll('.recognition-track,.other-partner-track').forEach(track=>{\n              const existing=[...track.children];\n              if(!existing.length) return;\n              let firstGroup=existing.find(el=>el.classList.contains('track-group'));\n              if(!firstGroup){\n                firstGroup=document.createElement('div');\n                firstGroup.className='partner-slider-set';\n                existing.forEach(el=>firstGroup.appendChild(el));\n              }else{\n                firstGroup.classList.add('partner-slider-set');\n              }\n              const clone=firstGroup.cloneNode(true);\n              track.replaceChildren(firstGroup,clone);\n              track.classList.add('seamless-ready');\n            });\n          });\n          </script>\n          '''
          if 'seamless-ready' not in s:
              s=s.replace('</body>', js+'</body>')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: seamless partner sliders [partner-layout-fix]'
          git push