name: Prepare partner logos

on:
  push:
    paths:
      - 'Partners/**'
      - 'bendemen.png'
      - 'bendemenstudios.png'
      - 'stichtingsuperhelden.png'
      - '.github/workflows/prepare-partner-logos.yml'

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y libheif-examples

      - name: Prepare Partners folder
        shell: bash
        run: |
          set -e
          mkdir -p Partners
          for f in bendemen.png bendemenstudios.png stichtingsuperhelden.png; do
            if [ -f "$f" ]; then mv "$f" "Partners/$f"; fi
          done
          if [ -f "Partners/bendemen.avif" ]; then
            heif-convert "Partners/bendemen.avif" "Partners/bendemen.png"
          fi

      - name: Convert partner logos to AVIF and keep PNG fallback
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for png in Partners/*.png; do
            base="${png%.png}"
            heif-enc --avif -q 82 "$png" -o "${base}.avif"
          done
          for avif in Partners/*.avif; do
            base="${avif%.avif}"
            if [ ! -f "${base}.png" ]; then
              heif-convert "$avif" "${base}.png"
            fi
          done

      - name: Commit prepared partner assets
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Partners
          git rm -f bendemen.png bendemenstudios.png stichtingsuperhelden.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No partner asset changes."
            exit 0
          fi
          git commit -m "Prepare partner logos as AVIF with PNG fallbacks"
          git push
